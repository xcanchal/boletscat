services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boletada
      POSTGRES_USER: boletada
      POSTGRES_PASSWORD: boletada_local
    ports:
      - "5432:5432"
    volumes:
      - boletada_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boletada -d boletada"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  boletada_postgres:
